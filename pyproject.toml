[project]
name = "gulf-dialect-rewriter"
version = "0.1.0"
description = "Fine-tune a small open model to rewrite Gulf-dialect Arabic questions into Modern Standard Arabic, measured before and after on a text-to-SQL benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Training and inference on the GPU; not needed for the tests
train = [
  "torch>=2.7",
  "transformers>=4.50",
  "datasets>=3.0",
  "peft>=0.15",
  "trl>=0.17",
  "accelerate>=1.5",
  "bitsandbytes>=0.45",
]
dev = ["pytest>=8"]

[project.scripts]
gdr = "gdr.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
